name: Build Android with EAS

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: apk
        type: choice
        options:
          - apk
          - production
          - development

jobs:
  build-android:
    name: Build Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm exec tsc --noEmit

      - name: Start EAS Android build
        run: >-
          pnpm dlx --config.ignore-scripts=true eas-cli@19.1.0 build
          --platform android
          --profile ${{ inputs.profile }}
          --non-interactive
          --wait

      - name: Download latest Android build artifact
        run: >-
          pnpm dlx --config.ignore-scripts=true eas-cli@19.1.0 build:download
          --platform android
          --latest
          --non-interactive
          --path android-${{ inputs.profile }}.${{ inputs.profile == 'production' && 'aab' || 'apk' }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-${{ inputs.profile }}
          path: android-${{ inputs.profile }}.${{ inputs.profile == 'production' && 'aab' || 'apk' }}
